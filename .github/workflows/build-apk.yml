name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install buildozer
          pip install "pyjnius>=1.4.0"

      - name: Install Android Build-Tools and accept licenses
        run: |
          SDKMANAGER=$(find ~/.buildozer -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          fi
          
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "build-tools;34.0.0" || true
          
          echo "$HOME/.buildozer/android/platform/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Build APK with Buildozer
        run: |
          echo y | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sportlife-apk
          path: bin/*.apk

name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Устанавливаем всё необходимое
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          
          # Скачиваем libtinfo5 (нужен для сборки)
          curl -O http://launchpadlibrarian.net/648013231/libtinfo5_6.4-2_amd64.deb
          sudo dpkg -i libtinfo5_6.4-2_amd64.deb

      - name: Install Buildozer
        run: |
          pip install buildozer
          pip install cython==0.29.33
          # УДАЛЕНА строка pip install "jnius>=1.4.0" - она вызывала ошибку!

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sportlife-apk
          path: bin/*.apk
